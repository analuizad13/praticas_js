<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Cálculo de Nota Final - IFCE</title>
        <script src="./index.js" defer></script>
    </head>
    <body>
        <h1>CÁLCULO DE NOTA FINAL (IFCE)</h1>
        <p>Calcule a sua nota final com base nas etapas N1 (peso 2) e N2 (peso 3).</p>     
        <form id="formDados">
            <label for="notaN1">Nota N1 (peso 2):</label>
            <input type="number" step="0.1" min="0" max="10" id="notaN1" required>
            <br><br>
            <label for="notaN2">Nota N2 (peso 3):</label>
            <input type="number" step="0.1" min="0" max="10" id="notaN2" required>
            <br><br>
            <button type="submit">Calcular Média</button>
        </form>
        <p id="resultado"></p>
    </body>
</html>
