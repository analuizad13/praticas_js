<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Números Ímpares no Intervalo</title>
        <script src="./index.js" defer></script>
    </head>
    <body>
        <h1>LOCALIZAR NÚMEROS ÍMPARES</h1>
        <p>Informe dois números inteiros para encontrar todos os números ímpares entre eles.</p>
        <form id="formDados">
            <label for="valor1">Primeiro valor:</label>
            <input type="number" id="valor1" required>
            <br><br>
            <label for="valor2">Segundo valor:</label>
            <input type="number" id="valor2" required>
            <br><br>
            <button type="submit">Buscar Ímpares</button>
        </form>
        <p id="resultado"></p>
    </body>
</html>
